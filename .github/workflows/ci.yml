name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bun run test
      # Real lint errors only: the formatting rule is off because Lovable
      # writes its own compact style, so it would fail on every Lovable edit.
      - name: Lint
        run: bun run lint:ci
